name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python tests/test_quality.py
      - run: python tests/test_trends.py
      - run: python tests/test_weekly.py
      - run: python tests/test_event_city.py
      - run: python tests/test_event_time.py
      - run: python tests/test_translation.py
      - run: python tests/test_art.py
      - run: python tests/test_exhibitions.py
      - run: python tests/test_product_focus.py
      - run: python tests/test_public_classes.py
      - run: node tests/test_event_time.js
      - run: node tests/test_sync.js
      - run: node tests/test_sync_integration.js
      - run: python scripts/build_static.py

